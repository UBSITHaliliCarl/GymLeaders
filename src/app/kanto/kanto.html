<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <section class="region-section">
    <h2>Kanto Region Gym Leaders</h2>
    <div class="card-grid">
      @for (leader of leaders(); track leader.name) {
        <app-leader-info 
          [leader]="leader" 
          [cardBorderColor]="'#ff4a4a'" 
          [titleColor]="'#cc0000'"
          [buttonColor]="'#ff4a4a'">
        </app-leader-info>
      }
    </div>
  </section>  
</body>
</html>
